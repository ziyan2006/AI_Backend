<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>TUCO AI 后端测试台</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">DIGITAL CIRCUIT LAB</p>
        <h1>TUCO AI 后端测试台</h1>
      </div>
      <div class="service-status"><span id="health-dot"></span><span id="health-text">检查服务中</span></div>
    </header>

    <main>
      <section class="panel config-panel">
        <div class="section-heading">
          <div><span class="step">01</span><h2>模型配置</h2></div>
          <button id="save-config" class="button secondary" type="button">应用到当前进程</button>
        </div>
        <div class="form-grid">
          <label>Base URL<input id="base-url" autocomplete="off" /></label>
          <label>模型名称<input id="model" autocomplete="off" /></label>
          <label>临时 API Key<input id="api-key" type="password" autocomplete="new-password" placeholder="留空表示不修改" /></label>
          <label>超时（秒）<input id="timeout" type="number" min="1" max="300" /></label>
        </div>
        <p class="hint" id="key-status">API Key 不会回显，也不会写入浏览器存储。</p>
      </section>

      <section class="workspace">
        <div class="panel decision-panel">
          <div class="section-heading">
            <div><span class="step">02</span><h2>电路决策测试</h2></div>
            <button id="run-decision" class="button primary" type="button">请求模型</button>
          </div>
          <label>用户问题<textarea id="question" rows="2">为什么这个与门电路的灯不亮？请指出需要检查的端口。</textarea></label>
          <label>电路快照 JSON<textarea id="snapshot" class="code-input" rows="18" spellcheck="false"></textarea></label>
          <div class="result-heading"><span>模型响应</span><span id="decision-time"></span></div>
          <pre id="decision-result">等待测试请求…</pre>
        </div>

        <aside class="panel ports-panel">
          <div class="section-heading compact">
            <div><span class="step">03</span><h2>端口预览</h2></div>
          </div>
          <p class="hint">工具调用返回后，对应端口会按参数动画显示。</p>
          <div id="port-grid" class="port-grid" aria-label="64 个电路端口"></div>
          <div id="tool-summary" class="tool-summary">尚未收到 highlight_ports</div>
        </aside>
      </section>

      <section class="panel protocol-panel">
        <div class="section-heading">
          <div><span class="step">04</span><h2>设备协议模拟</h2></div>
          <div class="actions">
            <button id="connect-ws" class="button secondary" type="button">连接 WebSocket</button>
            <button id="run-ws-demo" class="button primary" type="button" disabled>运行长按录音流程</button>
          </div>
        </div>
        <div class="protocol-layout">
          <div class="protocol-note">
            <strong>模拟顺序</strong>
            <p>device.hello → session.start → circuit.snapshot → input_audio.start → PCM → input_audio.commit</p>
          </div>
          <pre id="protocol-log">尚未连接设备 WebSocket…</pre>
        </div>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
