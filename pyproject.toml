[project]
name = "tuco-ai-backend"
version = "0.1.0"
description = "AI voice backend and device protocol for the TUCO digital circuit learning toy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
    "websockets>=16,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
tuco-ai-backend = "tuco_ai_backend.main:run"
tuco-device-simulator = "simulator.device_simulator:main"
tuco-level-llm-eval = "tuco_ai_backend.evaluation_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuco_ai_backend", "simulator"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
